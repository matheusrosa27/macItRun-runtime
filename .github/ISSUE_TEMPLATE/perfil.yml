name: Perfil de jogo / Game profile
description: Compartilhe um perfil que funcionou no macItRun. / Share a profile that worked in macItRun.
title: "[Perfil] "
labels: ["perfil"]
body:
  - type: markdown
    attributes:
      value: |
        Publicado pelo botão **Publicar na comunidade** do macItRun, com o perfil já preenchido.
        Published from macItRun's **Publish to Community** button, with the profile already filled in.
        Só ajustes de configuração; programas, links e arquivos são recusados pelo app.
        Settings only; programs, links and files are rejected by the app.
  - type: textarea
    id: profile
    attributes:
      label: Perfil / Profile
      description: Gerado pelo macItRun. Não edite. / Generated by macItRun. Do not edit.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Como foi / How it went
      description: FPS, travadas, o que não funciona. / FPS, stutters, what doesn't work.
